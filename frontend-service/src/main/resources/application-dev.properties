server.port=8082
spring.application.name=frontend-service

gateway-url=http://localhost:8081

gateway-service-uri=${gateway-url}
authentication-service-uri=${gateway-service-uri}/authentication
patient-service-uri=${gateway-service-uri}/patients
note-service-uri=${gateway-service-uri}/notes
risk-assessment-service-uri=${gateway-service-uri}/risk-assessment

# Active the filter for convert from POST Request to PUT, DELETE Method
spring.mvc.hiddenmethod.filter.enabled=true